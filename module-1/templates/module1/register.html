{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Водить.РФ | Регистрация</title>
  <link rel="stylesheet" href="{% static 'module1/styles.css' %}">
</head>
<body>
<div class="m1-top">
  <aside class="m1-side">
    <a class="m1-logo" href="{% url 'module1:login' %}">Водить.РФ</a>
    <nav class="m1-menu">
      <a href="{% url 'module1:login' %}">Вход</a>
      <a class="active" href="{% url 'module1:register' %}">Регистрация</a>
      <a href="{% url 'module1:admin' %}">Администратор</a>
    </nav>
  </aside>
  <main class="m1-main">
    <div class="m1-title"><h1>Регистрация пользователя</h1><p class="m1-note">Заполняются основные данные для личного кабинета.</p></div>
    <section class="m1-box">
      <form method="post" class="m1-grid" novalidate>
        {% csrf_token %}
        <label>ФИО {{ form.full_name }}<span class="field-error">{{ form.full_name.errors|striptags }}</span></label>
        <label>Дата рождения {{ form.birth_date }}<span class="field-error">{{ form.birth_date.errors|striptags }}</span></label>
        <label>Телефон {{ form.phone }}<span class="field-error">{{ form.phone.errors|striptags }}</span></label>
        <label>E-mail {{ form.email }}<span class="field-error">{{ form.email.errors|striptags }}</span></label>
        <label>Логин {{ form.login }}<span class="hint">Латиница и цифры, минимум 6 символов.</span><span class="field-error">{{ form.login.errors|striptags }}</span></label>
        <label>Пароль {{ form.password }}<span class="hint">Минимум 8 символов, буквы и цифры.</span><span class="field-error">{{ form.password.errors|striptags }}</span></label>
        <p class="form-message full">{{ form.non_field_errors|striptags }}</p>
        <button class="btn primary" type="submit">Создать</button>
      </form>
    </section>
  </main>
</div>
</body>
</html>
